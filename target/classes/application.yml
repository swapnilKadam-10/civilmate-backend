server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: civilmate-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civilmate}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: swapnil5945
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
springdoc.swagger-ui.path: /swagger-ui.html
app.cors.allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
security:
  jwt:
    secret-base64: E9IgfTUypDuEPBTXQthvIvGpNKAgN/jy6TQVDJFeNqc=
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  refresh-cookie-secure: ${AUTH_COOKIE_SECURE:false}
